# ============================================================
# XiaoYi 配置文件（框架模板）
# ============================================================
# 加载顺序与覆盖关系（后面的层覆盖前面的同名项）：
#   1. ~/.xiaoyi/config.yaml            （用户级）
#   2. <项目>/.xiaoyi/config.yaml       （项目级，即本文件）
#   3. <项目>/.xiaoyi/config.local.yaml （个人本地覆盖，如 API key）
# 找不到任何配置文件时程序会报错退出。
#
# 环境变量插值：MCP server 的 env 值支持 ${VAR} 写法，会从环境变量展开。
# providers[].api_key 不支持插值——留空即可，程序会自动回退到环境变量
# （anthropic -> ANTHROPIC_API_KEY，openai/openai-compat -> OPENAI_API_KEY）。
# ============================================================

# ---------- 模型提供方（必填，至少一个）----------
providers:
  # DeepSeek V4 Flash（OpenAI 兼容协议 -> 走 Chat Completions 端点）
  - name: deepseek
    protocol: openai-compat
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash-vision-exp
    api_key: "sk-0605cf514cfc474c879f5699c564e18b"                     # TODO: 在这里填入你的 DeepSeek API key
    thinking: false                 # 是否启用 thinking / 推理模式（bool）
    context_window: 1000000         # DeepSeek V4 文档标注 1M 上下文；如不对可改回 0 自动解析
    # max_output_tokens: 0          # 单次最大输出 token；0 = 使用内置默认

  # 其他协议参考（需要时取消注释）：
  # - name: anthropic               # Anthropic 官方（api_key 留空 -> ANTHROPIC_API_KEY）
  #   protocol: anthropic
  #   base_url: https://api.anthropic.com
  #   model: claude-sonnet-4-5
  #   api_key: ""
  #   thinking: false
  # - name: openai                  # OpenAI 官方（Responses API）
  #   protocol: openai
  #   base_url: https://api.openai.com/v1
  #   model: gpt-4o
  #   api_key: ""

# ---------- 权限模式 ----------
# 合法值：default | acceptEdits | plan | bypassPermissions | custom | dontAsk
# 也可启动时用 --mode 覆盖此设置
permission_mode: default

# ---------- 子 Agent / 团队功能 ----------
enable_fork: false                  # 是否启用 fork 子任务 agent
enable_verification_agent: false   # 是否启用验证 agent
enable_rag: true                    # 本地 RAG 知识库（预取注入 + KnowledgeSearch 工具）
teammate_mode: ""                   # 合法值："" | "in-process"
enable_coordinator_mode: false      # 是否启用协调者模式

# ---------- MCP 服务器（可选）----------
# 每个 server 必须有 name，且只能二选一：command（stdio）或 url（HTTP）。
# command + url 同时出现会被拒绝；headers / env 仅配合各自类型使用。
mcp_servers:
  # 文件系统 server：项目自带（xiaoyi/mcp/servers/filesystem.py），用 uv 拉起，不依赖 Node/npx。
  # --no-sync 不能少：否则 uv 每次启动子进程都会检查并重装项目环境，harness 自身占着
  # .venv 里的 xiaoyi.exe 时会重装失败。末尾的 "." 是允许访问的目录（= 启动 harness 的目录）。
  - name: filesystem
    command: uv
    args: ["run", "--no-sync", "python", "-m", "xiaoyi.mcp.servers.filesystem", "."]

  # 浏览器操作 server（Playwright 官方）：--executable-path 指向本机已装的 Chrome，
  # 免去下载 Chromium；默认有头模式（能看到操作过程），服务器上再加 --headless
  - name: playwright
    command: npx.cmd
    args:
      - "-y"
      - "@playwright/mcp@latest"
      - "--executable-path"
      - "C:/Program Files/Google/Chrome/Application/chrome.exe"
      # - "--headless"          # 无头模式：不弹窗口（服务器/CI 用）
      # - "--isolated"          # 每次全新临时配置，避免"浏览器已被占用"的残留锁问题
worktree:
  symlink_directories: ["node_modules", ".venv", "vendor"]  # 硬链接为目录
  stale_cleanup_interval: 3600    # 清理检查间隔（秒）
  stale_cutoff_hours: 24          # 超过该时长的 worktree 视为过期
