# ============================================================
# XiaoYi 配置文件（框架模板）
# ============================================================
# 加载顺序与覆盖关系（后面的层覆盖前面的同名项）：
#   1. ~/.xiaoyi/config.yaml            （用户级）
#   2. <项目>/.xiaoyi/config.yaml       （项目级，即本文件）
#   3. <项目>/.xiaoyi/config.local.yaml （个人本地覆盖，如 API key）
# 找不到任何配置文件时程序会报错退出。
#
# 环境变量插值：MCP server 的 env 值支持 ${VAR} 写法，会从环境变量展开。
# providers[].api_key 不支持插值——留空即可，程序会自动回退到环境变量
# （anthropic -> ANTHROPIC_API_KEY，openai/openai-compat -> OPENAI_API_KEY）。
# ============================================================

# ---------- 模型提供方（必填，至少一个）----------
providers:
  # DeepSeek V4 Flash（OpenAI 兼容协议 -> 走 Chat Completions 端点）
  - name: deepseek
    protocol: openai-compat
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash-vision-exp
    api_key: "sk-0605cf514cfc474c879f5699c564e18b"                     # TODO: 在这里填入你的 DeepSeek API key
    thinking: false                 # 是否启用 thinking / 推理模式（bool）
    context_window: 1000000         # DeepSeek V4 文档标注 1M 上下文；如不对可改回 0 自动解析
    # max_output_tokens: 0          # 单次最大输出 token；0 = 使用内置默认

  # 其他协议参考（需要时取消注释）：
  # - name: anthropic               # Anthropic 官方（api_key 留空 -> ANTHROPIC_API_KEY）
  #   protocol: anthropic
  #   base_url: https://api.anthropic.com
  #   model: claude-sonnet-4-5
  #   api_key: ""
  #   thinking: false
  # - name: openai                  # OpenAI 官方（Responses API）
  #   protocol: openai
  #   base_url: https://api.openai.com/v1
  #   model: gpt-4o
  #   api_key: ""

# ---------- 权限模式 ----------
# 合法值：default | acceptEdits | plan | bypassPermissions | custom | dontAsk
# 也可启动时用 --mode 覆盖此设置
permission_mode: default

# ---------- 子 Agent / 团队功能 ----------
enable_fork: false                  # 是否启用 fork 子任务 agent
enable_verification_agent: false   # 是否启用验证 agent
enable_rag: true                    # 本地 RAG 知识库（预取注入 + KnowledgeSearch 工具）
teammate_mode: ""                   # 合法值："" | "in-process"
enable_coordinator_mode: false      # 是否启用协调者模式

# ---------- MCP 服务器（可选）----------
# 每个 server 必须有 name，且只能二选一：command（stdio）或 url（HTTP）。
# command + url 同时出现会被拒绝；headers / env 仅配合各自类型使用。
#
# 全部改用 uvx（Python 生态）启动，不依赖 Node/npx。
# uvx 首次运行会把依赖装进自己的缓存环境（~/.local/share/uv 或 %LOCALAPPDATA%\uv），
# 与项目 .venv 完全隔离；若 uvx 解析不到，可换成绝对路径，如
# C:/Users/<用户名>/.local/bin/uvx.exe
mcp_servers:
   # ---- 文件系统 ----
   # 原 npx 版本（@modelcontextprotocol/server-filesystem）为 Node 包，改用 Python 等价物。
   # --lock-root 限定可访问目录（原配置末尾的 "." 即此作用），留空则不限。
   # 注意：这些工具不走 XiaoYi 的权限矩阵与路径沙箱，写操作在 root 内直接生效。
   - name: filesystem
     command: uvx
     args: ["fsext-mcp-server", "--lock-root", "."]

   # ---- 网页抓取 ----
   # Anthropic 官方 Python 参考实现（modelcontextprotocol/servers 的 src/fetch）。
   # 提供 1 个工具：fetch —— 抓取 URL 并转成 Markdown，弥补内置工具无联网能力。
   - name: fetch
     command: uvx
     args: ["mcp-server-fetch"]

   # ---- 浏览器自动化 ----
   # 必须带 --with "mcp<2"：该包未适配 MCP Python SDK v2，不锁版本会在导入时直接崩溃。
   # （锁定只作用于 uvx 的隔离环境，不影响 XiaoYi 自己用的 mcp 版本。）
   # 提供 8 个工具：navigate / click / click_text / fill / screenshot / evaluate /
   # get_html_content / get_text_content。
   # 需要 Playwright 浏览器二进制；缺失时执行：
   #   uvx --from playwright playwright install chromium
   - name: playwright
     command: uvx
     args: ["--with", "mcp<2", "playwright-server"]

   # ---- 网页搜索 ----
   # DuckDuckGo 搜索，无需 API key，内置限速（search 30/分、fetch 20/分）。
   - name: search
     command: uvx
     args: ["duckduckgo-mcp-server"]

   # ---- PDF 处理 ----
   # 7 个工具：合并、拆分、加（文字/图片）水印、加密、转图片。
   - name: pdf
     command: uvx
     args: ["pdf-mcp-server"]

   # ---- Excel 表格 ----
   # 25 个工具：读写单元格、公式、图表、透视表、多工作表管理。
   # 注意必须带 stdio 子命令，直接 uvx excel-mcp-server 会报 Missing command。
   - name: excel
     command: uvx
     args: ["excel-mcp-server", "stdio"]

   # ---- 其他可选（取消注释即启用，均需 --with "mcp<2"）----
   # git 服务（13 个工具，功能与 Bash 调用 git 重叠度较高，故默认关闭）
   # - name: git
   #   command: uvx
   #   args: ["--with", "mcp<2", "mcp-server-git", "--repository", "."]
   #
   # 时间/时区服务
   # - name: time
   #   command: uvx
   #   args: ["--with", "mcp<2", "mcp-server-time", "--local-timezone", "Asia/Shanghai"]
   #
   # SQLite 查询服务（db 路径需已存在）
   # - name: sqlite
   #   command: uvx
   #   args: ["--with", "mcp<2", "mcp-server-sqlite", "--db-path", "data.db"]

#     env:
#       TOKEN: ${MY_TOKEN}          # 支持 ${ENV_VAR} 展开
#   - name: remote-api
#     url: https://example.com/mcp
#     headers:
#       Authorization: Bearer xxx

# ---------- Hooks（可选）----------
# 合法事件：session_start / session_end / turn_start / turn_end /
#   pre_tool_use / post_tool_use / pre_send / post_receive /
#   startup / shutdown / error / compact / permission_request /
#   file_change / command_execute
# action.type：command | prompt | http | agent
# 约束：reject 仅用于 pre_tool_use；async 不能用于 pre_tool_use；
#   if 条件支持 field == "value" / != / =~ 以及 && / ||（两者不可混用）。
